<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineTalk</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<header class="nav">
  <a class="logo" href="#" onclick="mostrarHome()">CineTalk</a>
  <nav>
    <a href="#">Lists</a>
    <a href="#" onclick="mostrarHome()">Films</a>
    <a href="#">Ranking</a>
  </nav>
  <svg class="busca" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><circle cx="10" cy="10" r="7"/><path d="M15 15l7 7"/></svg>
</header>

<main id="home">
  <section class="hero" id="hero">
    <div class="poster" id="poster" onclick="abrirTrailer(atual)"></div>
    <div class="info">
      <h1 id="titulo"></h1>
      <h3 id="diretor"></h3>
      <p id="sinopse"></p>
    </div>
    <div class="nota" id="nota"></div>
    <button class="seta" onclick="proximo()" aria-label="Próximo">&rarr;</button>
  </section>

  <h2 class="secao">Lançamentos</h2>
  <div class="lista" id="lista"></div>
</main>

<main id="trailers" hidden>
  <button class="voltar" onclick="mostrarHome()">&larr; Voltar</button>
  <div class="player">
    <iframe id="video" allowfullscreen allow="autoplay; encrypted-media"></iframe>
  </div>
  <div class="detalhes">
    <h1 id="t-titulo"></h1>
    <p id="t-sinopse"></p>
    <a class="botao" id="t-yt" target="_blank" rel="noopener">Ver no YouTube</a>
  </div>
  <h2 class="secao">Mais trailers</h2>
  <div class="lista" id="outros"></div>
</main>

<script src="home.js"></script>
</body>
</html>
