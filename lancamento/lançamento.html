<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CineTalk - Lançamentos</title>

    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="lançamento.css">
</head>

<body>
    <header class="nav">
        <a class="logo" href="home.html">CineTalk</a>
        <nav>
            <a href="#">Lists</a>
            <a href="home.html">Films</a>
            <a href="ranking.html">Ranking</a>
        </nav>
        <svg class="busca" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5">
            <circle cx="10" cy="10" r="7" />
            <path d="M15 15l7 7" />
        </svg>
    </header>

    <main>
        <section class="lancamentos">
            <div class="titulo">
                <h2>Latest Releases</h2>

                <div class="controles">
                    <button>&#9664;</button>
                    <button>&#9654;</button>
                </div>
            </div>

            <div class="lista-lancamentos">
                <div class="filme">
                    <img src="img/poster-1.webp" alt="The Shawshank Redemption">
                    <h3>The Shawshank Redemption</h3>
                    <small>1994</small>
                </div>

                <div class="filme">
                    <img src="img/poster-2.jpeg" alt="The Godfather">
                    <h3>The Godfather</h3>
                    <small>1972</small>
                </div>

                <div class="filme">
                    <img src="img/poster-3.jpeg" alt="The Dark Knight">
                    <h3>The Dark Knight</h3>
                    <small>2008</small>
                </div>

                <div class="filme">
                    <img src="img/poster-4.jpeg" alt="The Godfather Part II">
                    <h3>The Godfather Part II</h3>
                    <small>1974</small>
                </div>

                <div class="filme">
                    <img src="img/poster-5.jpeg" alt="12 Angry Men">
                    <h3>12 Angry Men</h3>
                    <small>1957</small>
                </div>
            </div>
        </section>

        <hr>

        <section class="catalogo">
            <div class="pesquisa">
                <svg viewBox="0 0 24 24" fill="none" stroke="#777" stroke-width="1.8">
                    <circle cx="10" cy="10" r="7" />
                    <path d="M15 15l7 7" />
                </svg>

                <input type="text" placeholder="Search">
            </div>

            <div class="filtros">
                <select>
                    <option>Gender</option>
                </select>

                <select>
                    <option>Year</option>
                </select>

                <select>
                    <option>Rating</option>
                </select>

                <select>
                    <option>Others</option>
                </select>
            </div>

            <div class="galeria">
                <div class="filme">
                    <img src="img/poster-1.webp" alt="The Shawshank Redemption">
                    <h3>The Shawshank Redemption</h3>
                </div>

                <div class="filme">
                    <img src="img/poster-2.jpeg" alt="The Godfather">
                    <h3>The Godfather</h3>
                </div>

                <div class="filme">
                    <img src="img/poster-3.jpeg" alt="The Dark Knight">
                    <h3>The Dark Knight</h3>
                </div>

                <div class="filme">
                    <img src="img/poster-4.jpeg" alt="The Godfather Part II">
                    <h3>The Godfather Part II</h3>
                </div>

                <div class="filme">
                    <img src="img/poster-5.jpeg" alt="12 Angry Men">
                    <h3>12 Angry Men</h3>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
