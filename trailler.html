<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineTalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">CineTalk</div>
    <nav class="main-nav" aria-label="Navegação principal">
      <a href="#">Lists</a>
      <a href="#">Films</a>
      <a href="#">Ranking</a>
    </nav>
    <button class="search" aria-label="Pesquisar"></button>
  </header>

  <main class="hero">
    <figure class="side-card">
      <img src="assets/side-left.png" alt="Homem-Aranha">
    </figure>

    <article class="featured">
      <div class="poster">
        <img src="assets/featured.png" alt="Homem-Aranha">
        <button class="poster-button" id="posterPlay" aria-label="Reproduzir trailer"><span>▷</span></button>
      </div>
      <div class="movie-meta">
        <div class="facts">2026&nbsp; • &nbsp;Action&nbsp; • &nbsp;Adventure&nbsp; • &nbsp;2h 15min&nbsp; • &nbsp;14</div>
        <p class="description">A young hero must face a new threat while trying to balance his personal life<br>with his responsibilities.</p>
        <button class="action trailer" id="trailerText">▶ Watch Trailer</button>
        <button class="action list">+ Add to a List</button>
        <div class="review">
          <div class="review-label">Leave a review</div>
          <div class="stars" aria-label="Avaliação">
            <button>★</button><button>★</button><button>★</button><button>★</button><button>☆</button>
          </div>
          <button class="action">Click to review</button>
        </div>
      </div>
    </article>

    <figure class="side-card">
      <img src="assets/side-right.png" alt="Cena de ação">
    </figure>
  </main>

  <footer class="footer">
    <nav class="footer-links" aria-label="Links institucionais">
      <a href="#">News</a>
      <a href="#">Apps</a>
      <a href="#">Year in Review</a>
      <a href="#">Terms</a>
      <a href="#">Contact</a>
    </nav>
    <div class="social" aria-label="Redes sociais">
      <a href="#" aria-label="Instagram">◎</a>
      <a href="#" aria-label="Threads">◎</a>
      <a href="#" aria-label="X">𝕏</a>
      <a href="#" aria-label="Bluesky">◡</a>
      <a href="#" aria-label="Facebook">f</a>
      <a href="#" aria-label="TikTok">♪</a>
    </div>
  </footer>

  <div class="modal" id="trailerModal" role="dialog" aria-modal="true" aria-label="Trailer">
    <div class="modal-inner">
      <button class="close" id="closeModal" aria-label="Fechar">×</button>
      <iframe id="trailerFrame"
        src=""
        title="Trailer"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
